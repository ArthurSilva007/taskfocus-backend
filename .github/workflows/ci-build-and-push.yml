name: CI Build and Publish

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JAR (module demo)
        working-directory: demo
        run: mvn -B -DskipTests clean package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./demo
          file: ./demo/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ toLower(github.repository_owner) }}/taskfocus-demo:latest
            ghcr.io/${{ toLower(github.repository_owner) }}/taskfocus-demo:${{ github.sha }}
          build-args: |
            JAR_FILE=demo-0.0.1-SNAPSHOT.jar

      - name: Show image info
        run: |
          echo "Image pushed: ghcr.io/${{ github.repository_owner }}/taskfocus-demo:${{ github.sha }}"

