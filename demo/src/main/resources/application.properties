# =======================================
# APLICAÇÃO
# =======================================
spring.application.name=taskfocus
server.port=${PORT:8085}

# =======================================
# BANCO DE DADOS (PostgreSQL)
# =======================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:8711}
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================================
# JPA / HIBERNATE
# =======================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

# =======================================
# JWT (JSON Web Token)
# =======================================
jwt.secret=${JWT_SECRET:mude_esta_chave_em_producao_use_openssl}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =======================================
# CORS (Cross-Origin Resource Sharing)
# =======================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# =======================================
# LOGGING
# =======================================
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG

# =======================================
# ACTUATOR / MANAGEMENT
# =======================================
management.endpoints.web.exposure.include=health,info
