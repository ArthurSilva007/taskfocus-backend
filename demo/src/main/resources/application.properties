# =======================================
# APLICAÇÃO
# =======================================
spring.application.name=${SPRING_APPLICATION_NAME:taskfocus}
# O Railway injeta a porta automaticamente na variável PORT
server.port=${PORT:8084}

# =======================================
# BANCO DE DADOS (PostgreSQL)
# =======================================
# Prioriza a URL direta do Railway se disponível, senão monta a partir das peças
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:taskdb}}}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}

# =======================================
# JPA / HIBERNATE
# =======================================
# 'update' cria as tabelas automaticamente se elas não existirem
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Dialeto moderno para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =======================================
# JWT (JSON Web Token)
# =======================================
# Evite deixar essa variável vazia no Railway para não dar erro de inicialização
jwt.secret=${JWT_SECRET:uma_chave_muito_segura_e_longa_para_gerar_o_token_jwt}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =======================================
# CORS (Cross-Origin Resource Sharing)
# =======================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173}

# =======================================
# LOGGING
# =======================================
logging.level.root=INFO
logging.level.org.springframework.security=INFO

# =======================================
# ACTUATOR / MANAGEMENT
# =======================================
management.endpoints.web.exposure.include=health,info

# =======================================
# MULTIPART
# =======================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB