# =======================================
# APLICAÇÃO
# =======================================
spring.application.name=${SPRING_APPLICATION_NAME:taskfocus}
# O Railway injeta a porta automaticamente na variável PORT
server.port=${PORT:8084}

# =======================================
# BANCO DE DADOS (PostgreSQL)
# =======================================
# Use uma URL JDBC limpa. No Railway, prefira definir SPRING_DATASOURCE_URL
# ou deixar o docker-entrypoint.sh converter DATABASE_URL automaticamente.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:taskdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================================
# JPA / HIBERNATE
# =======================================
# Mantido como 'update' para criar as tabelas que você não está encontrando
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Permite controlar inicialização via scripts schema.sql/data.sql (se existirem)
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# =======================================
# JWT (JSON Web Token)
# =======================================
jwt.secret=${JWT_SECRET:uma_chave_muito_segura_e_longa_para_gerar_o_token_jwt}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =======================================
# EMAIL / SMTP
# =======================================
# Spring cria o bean JavaMailSender a partir destas propriedades.
# Configure via Railway Variables (SPRING_MAIL_*)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}

# =======================================
# CORS (Cross-Origin Resource Sharing)
# =======================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173}

# =======================================
# LOGGING
# =======================================
logging.level.root=INFO
logging.level.org.springframework.security=INFO

# =======================================
# ACTUATOR / MANAGEMENT
# =======================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =======================================
# MULTIPART
# =======================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB